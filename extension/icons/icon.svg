<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#80050B" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0E1118"/>
  <rect x="8" y="8" width="112" height="112" rx="20" fill="url(#grad)" filter="url(#shadow)"/>
  <!-- Film reel / scissor episodic break motif -->
  <circle cx="44" cy="48" r="14" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="44" cy="48" r="6" fill="#0E1118"/>
  <circle cx="84" cy="48" r="14" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="84" cy="48" r="6" fill="#0E1118"/>
  <!-- Play triangle / slice incision -->
  <polygon points="52,70 82,88 52,106" fill="#F5C518"/>
  <!-- Cut slash mark -->
  <line x1="28" y1="100" x2="100" y2="28" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="10,6" opacity="0.7"/>
</svg>
