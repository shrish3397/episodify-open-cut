<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episodify Open Cut - Interactive Demo Player</title>
  <link rel="stylesheet" href="../overlay.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #090a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .demo-header {
      padding: 20px;
      text-align: center;
    }
    .demo-header h1 {
      font-size: 24px;
      margin: 0 0 6px 0;
      color: #ff3b47;
    }
    .demo-header p {
      color: #8b949e;
      margin: 0;
      font-size: 14px;
    }
    .player-container {
      position: relative;
      width: 900px;
      max-width: 95%;
      height: 506px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .controls-panel {
      width: 900px;
      max-width: 95%;
      margin-top: 16px;
      background: #141721;
      padding: 16px 20px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .btn {
      background: #e50914;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-secondary {
      background: #2a2f40;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .time-display {
      font-family: monospace;
      font-size: 16px;
      color: #f5c518;
    }
  </style>
</head>
<body>
  <div class="demo-header">
    <h1>🎬 Episodify Open Cut - Player Simulator</h1>
    <p>Test the episodic act break triggers and cinematic card overlay in real-time.</p>
  </div>

  <div class="player-container" id="video-wrapper">
    <video id="demo-video" controls poster="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1200&q=80">
      <!-- High-quality royalty-free video clip for playback demonstration -->
      <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
  </div>

  <div class="controls-panel">
    <div>
      <span style="color: #8b949e; font-size: 13px;">Current Playback: </span>
      <span class="time-display" id="clock-display">00:00:00</span>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button class="btn btn-secondary" id="jump-break1-btn">Fast Forward to 5s before Break 1</button>
      <button class="btn" id="simulate-break-btn">Trigger Break Modal Now</button>
      <button class="btn btn-secondary" id="offline-stream-btn" title="Generate procedural offline test video with zero network">🎨 Offline Canvas Stream</button>
    </div>
  </div>

  <!-- Isolated Shadow DOM Content Script Overlay -->
  <script src="../content/overlay.js"></script>
  <script>
    const video = document.getElementById("demo-video");
    const clock = document.getElementById("clock-display");

    // Demo recipe calibrated for the demo clip
    const demoRecipe = {
      $schema: "https://episodify.org/schema/v1.json",
      meta: {
        title: "The Big Adventure",
        year: 2024,
        runtime_seconds: 600,
        pacing: "prestige_drama"
      },
      total_episodes: 3,
      episodes: [
        {
          episode_number: 1,
          title: "The Meadow Awakes",
          start_time: "00:00:00",
          end_time: "00:00:15",
          cliffhanger_rating: 8.8,
          break_rationale: "Act I setup closes as morning light exposes the intruders.",
          recap_text: "Our gentle hero steps out into the meadow as mysterious rivals watch from the tree canopy.",
          teaser_next: "An unexpected conflict erupts by the riverbank."
        },
        {
          episode_number: 2,
          title: "The Ambush",
          start_time: "00:00:15",
          end_time: "00:00:45",
          cliffhanger_rating: 9.6,
          break_rationale: "Midpoint crisis peak before the retaliatory strike.",
          recap_text: "The flying squirrel initiates aerial harassment, leaving the meadow in disarray.",
          teaser_next: "Zero hour arrives as complex contraptions are deployed."
        },
        {
          episode_number: 3,
          title: "The Reckoning",
          start_time: "00:00:45",
          end_time: "00:09:56",
          cliffhanger_rating: 7.9,
          break_rationale: "Series finale resolution.",
          recap_text: "Justice is restored to the meadow with triumphant retribution.",
          teaser_next: "Series finale concludes the story."
        }
      ]
    };

    // Load demo recipe into Shadow DOM Overlay
    function applyDemoRecipe() {
      if (window.EpisodifyOverlay) {
        window.EpisodifyOverlay.setRecipe(demoRecipe);
      }
      window.postMessage({ action: "SET_RECIPE", recipe: demoRecipe }, "*");
      if (typeof chrome !== "undefined" && chrome.storage?.local) {
        chrome.storage.local.set({ active_recipe: demoRecipe });
      }
    }
    applyDemoRecipe();
    setTimeout(applyDemoRecipe, 200);

    video.addEventListener("timeupdate", () => {
      const s = Math.floor(video.currentTime);
      const m = Math.floor(s / 60);
      const sec = s % 60;
      clock.textContent = `00:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    });

    document.getElementById("jump-break1-btn").addEventListener("click", () => {
      video.currentTime = 10;
      video.play().catch(() => {});
    });

    document.getElementById("simulate-break-btn").addEventListener("click", () => {
      video.currentTime = 14;
      video.play().catch(() => {});
    });

    // Offline procedural canvas video fallback (100% network-free)
    function setupOfflineStream() {
      const canvas = document.createElement("canvas");
      canvas.width = 960;
      canvas.height = 540;
      const ctx = canvas.getContext("2d");
      let frame = 0;

      function renderFrame() {
        frame++;
        const tSec = frame / 30;
        
        // Gradient background
        const g = ctx.createLinearGradient(0, 0, 960, 540);
        g.addColorStop(0, "#0b0e14");
        g.addColorStop(1, "#181e2b");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 960, 540);

        // Animated pulse circle
        const cx = 480 + Math.sin(tSec * 2) * 200;
        ctx.beginPath();
        ctx.arc(cx, 270, 40, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(229, 9, 20, 0.4)";
        ctx.fill();

        // Title
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 28px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("EPISODIFY OPEN CUT - OFFLINE TEST STREAM", 480, 240);

        // Timecode
        const mins = Math.floor(tSec / 60);
        const secs = Math.floor(tSec % 60);
        ctx.fillStyle = "#f5c518";
        ctx.font = "bold 32px monospace";
        ctx.fillText(`PLAYHEAD: 00:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`, 480, 290);

        requestAnimationFrame(renderFrame);
      }
      renderFrame();

      try {
        const stream = canvas.captureStream(30);
        video.srcObject = stream;
        video.play().catch(() => {});
      } catch (err) {
        console.warn("Canvas stream error:", err);
      }
    }

    document.getElementById("offline-stream-btn").addEventListener("click", setupOfflineStream);

    // Auto-fallback if online BigBuckBunny is blocked or fails
    video.addEventListener("error", () => {
      console.log("[EOC Demo] Remote clip failed to load, switching to offline procedural canvas stream.");
      setupOfflineStream();
    });
  </script>
</body>
</html>
